services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 4000
      DATA_FILE: /app/backend/data/tickets.json
    ports:
      - "4000:4000"
    volumes:
      - helpdesk-data:/app/backend/data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  helpdesk-data:
